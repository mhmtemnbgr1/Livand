<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofis</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="alternate icon" type="image/png" href="icon-256.png">
<link rel="apple-touch-icon" href="icon-256.png">
<meta name="theme-color" content="#1c1a16">
<style>
/* ===== LIVAND Ofis — "büro kırtasiyesi" tasarım dili =====
   krem kâğıt yüzeyler, mürekkep yazı, damga turuncusu vurgu; tabela yazısı (Bahnschrift) */
:root{
  --bg:#1c1a16;
  --paper:#f3eee3;--paper2:#e9e2d3;--card:#fbf8f1;--glass:var(--paper);--glass2:var(--paper2);
  --ink:#201d18;--tx:var(--ink);--mut:#71695c;--line:rgba(32,29,24,.14);--line2:rgba(32,29,24,.28);
  --acc:#d9532a;--acc-tx:#fff7ef;--ok:#2e7a58;--warn:#b98612;--bad:#b5402c;
  --r:8px;--panel:min(420px,calc(100vw - 24px));
  --shadow:0 1px 0 rgba(32,29,24,.22),0 14px 34px rgba(0,0,0,.32);
  --fd:Bahnschrift,"DIN Alternate","Segoe UI Variable Display","Segoe UI",sans-serif;
  --fm:"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:6px 12px;transition:background .12s,border-color .12s,transform .06s;font-family:var(--fd);font-size:13px;letter-spacing:.02em}
button:hover{background:#fff;border-color:var(--ink)}
button:active{transform:translateY(1px)}
button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}button.pri:hover{background:#000}
button.ghost{background:transparent;border-color:transparent}button.ghost:hover{background:rgba(32,29,24,.07);border-color:transparent}
.lvl{font:600 10px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.gw{background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin:6px 0 4px}.gwh{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}.lvlb{font:600 15px var(--fd);letter-spacing:.04em;color:var(--acc);text-transform:uppercase}.gw .bp{margin:2px 0 3px}.gwf{font-size:12.5px;margin-top:6px}.gw details{margin-top:6px;font-size:12.5px}.gw summary{cursor:pointer;font:600 12px var(--fd);letter-spacing:.04em}.gw ul{margin:4px 0;padding-left:18px}
.mem .src{font-style:normal;font:10.5px var(--fd);letter-spacing:.05em;color:var(--mut);text-transform:uppercase;margin-left:4px}
.m.lvup{border-left-color:var(--acc);background:#fbe7da}
.sv-big{display:flex;align-items:baseline;gap:8px;font:600 34px var(--fd);margin:2px 0 6px}.sv-big span{font:12.5px var(--fd);letter-spacing:.04em;color:var(--mut)}.sv-big.up{color:var(--ok)}.sv-big.down{color:var(--bad)}
.sv-row{display:flex;gap:6px;align-items:baseline;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}.sv-row b.ok{color:var(--ok)}.sv-row b.bad{color:var(--bad)}
.sv-m{margin-top:8px;font-size:12.5px}.sv-m summary{cursor:pointer;font:600 12px var(--fd);letter-spacing:.04em}.sv-m p{margin:6px 0}.sv-m ul{margin:4px 0 6px;padding-left:18px}.sv-m a{color:var(--ink)}.sv-base input{width:70px}
.sv-set{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-top:8px}.sv-set label{display:flex;flex-direction:column;font:600 10.5px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);gap:2px}.sv-set input{width:96px;padding:5px 7px}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}button.danger:hover{background:#9a3322}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(217,83,42,.18)}
input[type=checkbox]{accent-color:var(--acc)}
select option{background:var(--card);color:var(--ink)}
.glass{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow)}
.sp{flex:1}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(32,29,24,.22);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
code{font:12px var(--fm);background:var(--paper2);padding:1px 5px;border-radius:4px;word-break:break-all}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mut{color:var(--mut)}

/* ===== sahne: isim plakaları ve konuşma balonları ===== */
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block}
.otag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;white-space:nowrap}
.otag .on{display:inline-block;background:var(--paper);color:var(--ink);border:1px solid rgba(32,29,24,.55);border-left:4px solid var(--c,#888);border-radius:3px;padding:0 7px;font:600 .74em var(--fd);letter-spacing:.09em;pointer-events:auto;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.otag .on:hover{background:#fff}
.otag .ob{position:relative;background:#fffdf7;color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;padding:1px 9px;font:600 11px var(--fd)!important;letter-spacing:.02em;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.otag .ob::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.otag .ob.zz{background:#2b2924;color:#d9d2c3;border-color:#2b2924}
.otag .ob.act{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.otag .ob.err{background:var(--bad);color:#fff;border-color:#6d2216}.otag .ob.lim{background:#e8a33a;color:var(--ink);border-color:#7a5410}.otag .ob.ok{background:#4fae80;color:#fff;border-color:#1f5a40}

/* ===== üst çubuk ===== */
#top{position:fixed;z-index:5;left:12px;top:12px;display:flex;align-items:center;gap:4px;padding:5px 6px}
#top select{border:none;background:transparent;font:600 16px var(--fd);letter-spacing:.01em;padding:5px 8px;max-width:230px;cursor:pointer}
#top select:focus{box-shadow:none}
#top .ib{color:var(--ink)}
#dot,#dot2{width:9px;height:9px;border-radius:2px;background:var(--bad);flex-shrink:0;margin-left:4px}
#dot.ok,#dot2.ok{background:var(--ok)}#dot.demo,#dot2.demo{background:var(--warn)}#dot.off,#dot2.off{background:#a39b8c}#dot.warn{background:var(--warn)}#dot.lim{background:var(--bad)}
#cliBtn{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 7px;border-radius:5px;font:600 12px var(--fd);letter-spacing:.08em;background:var(--paper2);border-color:var(--line2)}
#cliBtn b{font-weight:600}#cliBtn.off b{color:var(--mut)}
#tok{color:var(--mut);font:12px var(--fm);padding:0 8px;white-space:nowrap;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ib{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:6px;font-size:16px}
#langBtn{font:600 11.5px var(--fd);letter-spacing:.1em}
#budget{position:absolute;left:8px;right:8px;bottom:0;height:3px;background:rgba(32,29,24,.08);overflow:hidden}#budget i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}#budget.warn i{background:var(--warn)}#budget.full i{background:var(--bad)}
#top{position:fixed}

/* ===== ekip listesi ===== */
#roster{position:fixed;z-index:4;left:12px;top:70px;width:180px;padding:6px;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 150px);overflow:auto}
.rs{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:5px;cursor:pointer;border-bottom:1px dashed var(--line)}
.rs:last-of-type{border-bottom:none}
.rs:hover{background:var(--card)}
.rs .ini{width:26px;height:26px;font-size:12px}
.rs b{display:block;font:600 12.5px var(--fd);letter-spacing:.04em}
.rs small{display:block;color:var(--mut);font-size:11px;margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.rs .sc{margin-left:auto;font:600 11px var(--fm);color:var(--acc)}
.st{width:7px;height:7px;border-radius:1px;background:#bdb5a5;flex-shrink:0}
.st.w{background:var(--ok);animation:pl 1.2s infinite}.st.q{background:var(--warn);animation:pl .8s infinite}.st.e{background:var(--bad);animation:pl .8s infinite}
@keyframes pl{50%{opacity:.3}}
.ini{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:4px;color:#fff;font:600 .72em var(--fd);font-style:normal;vertical-align:middle;flex-shrink:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.rof{display:flex;align-items:baseline;gap:6px;padding:4px 7px 6px;border-bottom:1px solid var(--line2);margin-bottom:2px}.rof b{font:600 12px var(--fd);letter-spacing:.05em;text-transform:uppercase}.rof small{color:var(--mut);font-size:11px;margin-left:auto}
.rs .lead{font:600 9px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-left:3px}
#offSel{max-width:150px}.hl{display:flex;flex-direction:column;gap:4px;margin-top:6px}.hl button{text-align:left;display:flex;gap:8px;align-items:center}.hl button i{width:10px;height:10px;border-radius:50%;flex:none}
.offm{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}.offm label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px}
.rbtns{display:flex;gap:6px;padding:7px 2px 2px;border-top:1px solid var(--line2);margin-top:4px}.rbtns button{flex:1;padding:4px 6px;font-size:12px}

/* ===== sağ panel ===== */
#panel{position:fixed;z-index:6;right:12px;top:12px;bottom:12px;width:var(--panel);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
#panel.closed{transform:translateX(calc(100% + 24px))}
#ph{display:flex;align-items:flex-end;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line2);background:var(--paper2)}
#ph .ghost{margin-bottom:5px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;flex-shrink:0}#ph .ib{flex-shrink:0}
#ph .ib{margin-bottom:4px}
#tabs{display:flex;gap:2px}
#tabs{min-width:0;overflow:hidden}#tabs button{border:1px solid transparent;border-bottom:none;background:transparent;border-radius:6px 6px 0 0;padding:7px 10px 6px;flex-shrink:0;color:var(--mut);font:600 12.5px var(--fd);letter-spacing:.07em;text-transform:uppercase;margin-bottom:-1px}
#tabs button:hover{color:var(--ink);background:transparent}
#tabs button.on{background:var(--paper);color:var(--ink);border-color:var(--line2);box-shadow:inset 0 3px 0 var(--acc)}
#ptitle{padding:6px 14px 0;min-height:18px;font:12px var(--fd);letter-spacing:.05em;color:var(--mut)}
#chips{display:flex;gap:5px;padding:6px 12px 8px;overflow-x:auto;flex-shrink:0}
.chip{white-space:nowrap;padding:2px 9px;border-radius:4px;font:600 11.5px var(--fd);letter-spacing:.04em;background:transparent;border:1px solid var(--line2);color:var(--mut);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pv{flex:1;overflow:auto;padding:8px 12px}
#msgs{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:260px;line-height:1.6;font-size:13px}
.m{max-width:88%;padding:7px 11px 5px;border-radius:6px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line2);align-self:flex-start}
.m.me{background:#fbe7da;border-color:rgba(217,83,42,.25);border-left-color:var(--acc);align-self:flex-end}
.m[data-req]{cursor:pointer}.m[data-req]:hover{border-color:var(--line2)}
.m .h{font:600 12px var(--fd);letter-spacing:.03em;display:flex;align-items:center;gap:6px}.m .h i.to{font-weight:400;color:var(--mut);font-style:normal}
.m .b{white-space:pre-wrap;word-break:break-word}
.m .f{font:10.5px var(--fm);color:var(--mut);text-align:right;margin-top:2px}
.acc{margin-bottom:10px}.ac{font-size:12.5px;padding:3px 0;color:var(--mut)}.ac b{color:var(--mut);margin-right:4px}.ac.ok b{color:var(--ok)}.ac.bad b{color:var(--bad)}.ac.ok,.ac.bad{color:var(--ink)}
.caps{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:middle}.caps i{font:600 10.5px var(--fd);font-style:normal;letter-spacing:.04em;padding:1px 6px;border-radius:10px;background:#e4eefb;color:#2c5d9e;border:1px solid #c5d8f2}
.step .caps{display:flex;margin:4px 0 2px}
.m.mt{border-left-color:#8a84ad;background:#f1eff8;max-width:100%;align-self:stretch}
.m.ho{background:transparent;border:1px dashed var(--line2);font-size:12px;color:var(--mut);max-width:100%}
.m.sc{background:#f6edd2}
.m.plan{background:var(--card);border:1px solid var(--line2);border-top:3px solid var(--ok);max-width:100%;align-self:stretch}
.m.apv{background:#f8efd6;border:1px solid rgba(185,134,18,.4);border-top:3px solid var(--warn);max-width:100%;align-self:stretch}
.m.plan ul{margin:3px 0 6px;padding-left:18px}.m.plan li{margin:2px 0}
.lbl2{color:var(--mut);font:600 10.5px var(--fd);text-transform:uppercase;letter-spacing:.12em;margin-top:10px}
.lbl{color:var(--mut);font:600 11px var(--fd);text-transform:uppercase;letter-spacing:.1em}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.btns button{padding:5px 11px}
.stl{font-size:12px;color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:12px/1.45 var(--fm);max-height:220px;overflow:auto;margin:5px 0}
#typing{padding:0 14px;min-height:20px;color:var(--ok);font:12px var(--fd);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#comp{display:flex;gap:8px;padding:9px 10px 10px;border-top:1px solid var(--line2);align-items:flex-end;background:var(--paper2)}
#inp{flex:1;resize:none;height:44px;max-height:140px}
#comp .col{display:flex;flex-direction:column;gap:6px}
#send{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);height:44px;padding:0 16px;text-transform:uppercase;letter-spacing:.08em}#send:hover{background:#c2441d}
#fab{position:fixed;z-index:6;right:16px;bottom:16px;display:none;padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);background:var(--paper)}
#fab.show{display:block}
#fab em{font-style:normal;background:var(--acc);color:var(--acc-tx);border-radius:4px;padding:0 6px;margin-left:6px;font-size:12px;font-weight:700}
#bar{padding:0 12px}
.banner{display:flex;align-items:center;gap:10px;margin:6px 0;padding:8px 10px 8px 12px;border-radius:6px;background:#f8efd6;border:1px solid rgba(185,134,18,.45);font-size:13px}

/* ===== pano: adımlar ===== */
.bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:4px 0 10px}.bh b{font:600 22px var(--fd)}.bh span{color:var(--mut);font:12px var(--fd);letter-spacing:.05em}
.bp{flex-basis:100%;height:6px;background:var(--paper2);border:1px solid var(--line);border-radius:3px;overflow:hidden}.bp i{display:block;height:100%;background:var(--ok)}
.steps{position:relative;display:flex;flex-direction:column;gap:8px}
.steps::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;border-left:2px dotted var(--line2)}
.step{position:relative;display:flex;gap:10px;align-items:flex-start}
.sn{position:relative;z-index:1;width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--card);border:1.5px solid var(--line2);font:600 13px var(--fd);color:var(--mut)}
.step.doing .sn{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 3px rgba(46,122,88,.15)}
.step.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.step.bad .sn{background:var(--bad);border-color:var(--bad);color:#fff}
.sb{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.step.doing .sb{border-color:rgba(46,122,88,.5)}
.sh{display:flex;align-items:center;gap:8px}
.who{font:600 12.5px var(--fd);letter-spacing:.04em;padding-left:8px;border-left:3px solid var(--c)}
.tag{margin-left:auto;font:600 10.5px var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--mut)}
.tag.doing{border-color:var(--ok);color:var(--ok)}.tag.done{background:var(--ok);border-color:var(--ok);color:#fff}.tag.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.si{margin:3px 0 1px;font-size:13px}
.sm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mut)}
.kd{font:600 10px var(--fd);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--paper2);color:var(--mut)}
.rv{margin:6px 0 2px;padding:5px 8px;border-left:3px solid var(--line2);border-radius:0 4px 4px 0;background:var(--paper2);font-size:12px;color:var(--mut)}
.rv.ok{border-left-color:var(--ok)}.rv.fix{border-left-color:var(--warn)}
.sk{border:1px solid var(--line2);border-radius:6px;padding:6px 8px;margin:4px 0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}.sk.off{opacity:.55}
#mbox .sk .skh,.sk .skh{display:flex;align-items:center;gap:6px;flex:1;margin:0;font:500 13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}.sk .skh input{width:auto;margin:0}
.sk>.stl,.sk>details{flex-basis:100%}.sk details{font-size:12px}.sk summary{cursor:pointer;color:var(--mut)}.sk ul{margin:4px 0;padding-left:18px}
.sk button{padding:3px 8px;font-size:12px}.skadd{display:flex;flex-direction:column;gap:6px;margin-top:6px}.skadd textarea{min-height:70px}
.rv summary{cursor:pointer}.rv ul{margin:4px 0 0;padding-left:18px}.rv li{margin:2px 0}
.prog{height:3px;border-radius:2px;background:var(--paper2);margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;width:40%;background:var(--ok);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.run{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px}.run .stl{flex:1}.run button{font-size:12px;padding:4px 9px}

/* ===== günlük ===== */
.lgbar{display:flex;justify-content:flex-end;padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lgbar label{display:flex;gap:6px;align-items:center;font:12px var(--fd);letter-spacing:.04em;color:var(--mut);cursor:pointer}
.lg{display:flex;gap:8px;padding:4px 0;align-items:baseline;font-size:12.5px;border-bottom:1px dotted var(--line)}
.lg .t{color:var(--mut);font:11px var(--fm);flex-shrink:0;width:38px}
.lg .li{width:14px;flex-shrink:0;text-align:center;color:var(--mut);font-weight:700}
.lg .lt{min-width:0;word-break:break-word}.lg .lt b{font:600 12.5px var(--fd);letter-spacing:.03em;margin-right:2px}
.lg.k-task .lt{font-weight:600}.lg.k-task .li{color:var(--ink)}
.lg.k-error .lt,.lg.k-error .li{color:var(--bad)}
.lg.k-text .lt{color:var(--mut);font-style:italic}
.lg.k-result .lt{color:var(--mut);font:11.5px var(--fm)}
.lg.k-sub .li{color:var(--acc)}

/* ===== analiz ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0 0 10px}
.card .ch{display:flex;align-items:center;gap:6px;font:600 11px var(--fd);color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-bottom:2px}.card .ch .ib{width:26px;height:26px;font-size:15px}
.card .mut{font-size:12.5px;padding:4px 0}
.card .row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px}.card .row input{width:110px}
.prv{padding:8px 0;border-bottom:1px solid var(--line2)}.prv:last-of-type{border-bottom:0}

<script>
let ST=null,cur=null,filter='all',live={},unread=0,panelOpen=true;
let LANG='tr';try{LANG=localStorage.getItem('lang')||'tr'}catch{}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
let curOff=null;try{curOff=localStorage.getItem('office')}catch{}
const office=()=>ST.offices.find(o=>o.id===curOff)||ST.offices[0];
const projsOf=()=>ST.projects.filter(p=>p.officeId===office().id);
const hatT=k=>ST.hats?.[k]?.title||k;
// ajan (claude/codex/antigravity), şapka (ceo, developer…), kullanıcı ya da dış araç
const who=id=>id==='user'?ST.user:id==='all'?{name:'Herkes',color:'#8a84ad'}:ST.agents[id]||(ST.hats?.[id]?{name:ST.hats[id].title,color:ST.hats[id].color}:null)||ST.ext?.[id]||{name:id,color:'#888'};
const sender=m=>m.cli&&ST.agents[m.cli]?m.cli:m.from;   // şapkadan gelen mesajı o şapkayı takan ajan yazmıştır
const hatNow={},subs={};   // ajanın şu an taktığı şapka; açık stajyerleri (alt ajanlar)

const view=()=>{const o=office();return{user:ST.user,lead:o.lead,agents:Object.fromEntries(o.members.filter(k=>ST.agents[k]).map(k=>[k,ST.agents[k]])),roleText:id=>{const h=hatNow[id];return(ST.agents[id]?.name||id).toUpperCase()+(h?' · '+hatT(h).toUpperCase():id===o.lead?' · LİDER':'')}}};
const toCli=(k,p)=>ST.agents[k]?k:k==='ceo'?office().lead:p?.team?.[k]||k;
const viewMsg=m=>({...m,from:m.from==='user'?'user':sender(m)==='ceo'?office().lead:sender(m),to:['user','all'].includes(m.to)?m.to:toCli(m.to,proj())});
const av=id=>{const w=who(id);return`<i class="ini" style="background:${w.color}">${esc((w.name||'?')[0])}</i>`};
const proj=()=>ST.projects.find(p=>p.id===cur);
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n);
const hm=t=>new Date(t).toLocaleTimeString(LANG==='en'?'en':'tr',{hour:'2-digit',minute:'2-digit'});

const avg=a=>{let l=a.scores||[];const real=l.filter(x=>!x.demo);if(real.length)l=real;return l.length?l.reduce((s,x)=>s+x.score,0)/l.length:null};
const RANK={ceo:0,developer:1,designer:2,researcher:3,writer:4,auditor:5},RLAB={high:'YÜKSEK',medium:'ORTA',low:'DÜŞÜK'},RORD={high:0,medium:1,low:2};

async function load(){ST=await api('state');if(proj())curOff=proj().officeId;if(!cur||!proj()||proj().officeId!==office().id)cur=projsOf().at(-1)?.id;if(!cur){const p=await api('projects',{name:'Yeni proje',officeId:office().id});ST=await api('state');cur=p.id}renderAll()}
function renderAll(){
  if(!ST.offices.some(o=>o.id===curOff))curOff=ST.offices[0].id;
  if(!proj()||proj().officeId!==office().id){cur=projsOf().at(-1)?.id;if(!cur){api('projects',{name:'Yeni proje',officeId:office().id}).then(async p=>{ST=await api('state');cur=p.id;renderAll()});return}}
  renderTop();renderRoster();renderChips();renderChat();renderApprovals();window.Office?.setState(view());layout();renderTab();
}

  else if(act==='plogout'){if(confirm('Bağlantı kesilsin ve bu CLI\'nin bu bilgisayardaki girişi de silinsin mi? Tekrar bağlanırken tarayıcıda yeniden onay vermen gerekir.'))api('providers/'+b.dataset.k+'/disconnect',{logout:true})}

  else if(type==='project'){const i=ST.projects.findIndex(x=>x.id===data.id);if(i>=0){const {procs,...d}=data;const o=prevP[d.id]||{};ST.projects[i]=d;if(d.id===cur){renderChat();renderTop();renderTab();const dn=x=>(x.board||[]).filter(t=>t.status==='bitti').length;if($('#pv').classList.contains('on')&&(dn(d)!==dn(o)||d.verify?.ts!==o.verify?.ts))loadPv()}
    if(o.executing&&!d.executing)notify('İş tamamlandı',d.name,'done');
    if(d.pendingPlan&&o.plan!==d.pendingPlan.id)notify('Plan onayını bekliyor',d.name,'plan');
    prevP[d.id]={executing:!!d.executing,plan:d.pendingPlan?.id}}}
};
function boot(){window.Office.init({wrap:$('#stage'),onClick:id=>editAgent(id)}).then(()=>{ST&&window.Office.setState(view());layout()})}
window.addEventListener('office-ready',boot);if(window.Office)boot();
load();
</script>
